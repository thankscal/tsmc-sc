<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萬年曆 - 做二休二班表 (2026)</title>
    <style>
        :root {
            --primary: #2c3e50;
            
            /* 早班配色：淺黃底 + 黑字 */
            --early-bg: #fff9c4;
            --early-text: #000000;
            --early-border: #fdd835;
            
            /* 夜班配色：深紫黑底 + 黃字 */
            --night-bg: #2a1e3f;
            --night-text: #ffeb3b;
            --night-border: #4a3b63;
            
            /* 休假配色：淺綠底 + 深綠字 */
            --rest-bg: #e8f5e9;
            --rest-text: #1b5e20;
            --rest-border: #a5d6a7;
            
            --today-border: #ff9800;
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calendar-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .shift-info {
            font-size: 0.85rem;
            color: #555;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .nav-buttons button:hover {
            background-color: #1a252f;
        }

        /* 核心日曆網格：使用 minmax(0, 1fr) 防止內容撐破格子 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            padding: 10px 0;
            font-size: 1rem;
        }

        .weekday-header.weekend {
            color: #e53935;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 500;
            position: relative;
            cursor: default;
            transition: transform 0.1s;
            border: 2px solid transparent;
            padding: 4px;
            box-sizing: border-box;
            min-width: 0; /* 允許格子縮小 */
        }

        .day-cell:hover {
            transform: scale(1.05);
        }

        .day-cell.empty {
            background-color: #fafafa;
            border: none;
            pointer-events: none;
        }

        /* 早班樣式 */
        .day-cell.early {
            background-color: var(--early-bg);
            color: var(--early-text);
            border-color: var(--early-border); 
        }

        /* 夜班樣式 */
        .day-cell.night {
            background-color: var(--night-bg);
            color: var(--night-text);
            border-color: var(--night-border); 
        }

        /* 休假樣式 */
        .day-cell.rest {
            background-color: var(--rest-bg);
            color: var(--rest-text);
            border-color: var(--rest-border); 
        }

        .day-number {
            font-size: 1.3rem;
            line-height: 1;
        }

        .shift-badge {
            font-size: 0.7rem;
            margin-top: 4px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }

        /* 標籤色彩跟著班別走 */
        .early .shift-badge { background-color: var(--early-text); color: var(--early-bg); }
        .night .shift-badge { background-color: var(--night-text); color: var(--night-bg); }
        .rest .shift-badge { background-color: var(--rest-text); color: var(--rest-bg); }

        .shift-type-badge {
            font-size: 0.6rem;
            margin-top: 2px;
            font-weight: normal;
            opacity: 0.9;
        }

        /* 今天的樣式 */
        .day-cell.today {
            border: 3px solid var(--today-border) !important;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            z-index: 1;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            font-size: 0.9rem;
            color: #555;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border-width: 2px;
            border-style: solid;
        }

        .color-box.early { background-color: var(--early-bg); border-color: var(--early-border); }
        .color-box.night { background-color: var(--night-bg); border-color: var(--night-border); }
        .color-box.rest { background-color: var(--rest-bg); border-color: var(--rest-border); }
        .color-box.today { background-color: #fff; border: 3px solid var(--today-border); }

        /* ========== 手機版專屬優化 ========== */
        @media (max-width: 600px) {
            body { padding: 8px; } /* 減少外圍留白 */
            .calendar-container { padding: 12px; } /* 減少容器內距 */
            
            .header { 
                flex-direction: column; 
                align-items: stretch; 
                gap: 8px; 
                margin-bottom: 15px;
                padding-bottom: 10px;
            }
            .header h2 { font-size: 1.3rem; text-align: center; }
            .shift-info { text-align: center; font-size: 0.8rem; }
            .nav-buttons { justify-content: center; }
            .nav-buttons button { padding: 6px 12px; font-size: 0.85rem; }
            
            .calendar-grid { gap: 3px; } /* 縮小格子間距 */
            .weekday-header { font-size: 0.8rem; padding: 5px 0; }
            
            .day-cell {
                aspect-ratio: auto; /* 取消正方形，改用內容撐高 */
                min-height: 52px; /* 給予最小高度，確保美觀 */
                padding: 2px 0;
                border-width: 1px;
            }
            
            .day-number { font-size: 0.95rem; }
            
            /* 縮小標籤，避免撐破格子 */
            .shift-badge { 
                font-size: 0.5rem; 
                padding: 1px 3px; 
                margin-top: 2px;
                border-radius: 3px;
            }
            .shift-type-badge { 
                font-size: 0.45rem; 
                margin-top: 1px;
            }
            
            .day-cell.today { border-width: 2px !important; }
            
            /* 圖例改為垂直排列，節省寬度 */
            .legend { 
                flex-direction: column; 
                align-items: center; 
                gap: 8px; 
                font-size: 0.8rem; 
            }
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header">
        <h2 id="monthYearTitle">載入中...</h2>
        <div class="shift-info" id="currentShiftInfo">班別載入中...</div>
        <div class="nav-buttons">
            <button id="prevBtn">&lt; 上個月</button>
            <button id="todayBtn">回今天</button>
            <button id="nextBtn">下個月 &gt;</button>
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <!-- 日曆內容將由 JavaScript 動態生成 -->
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="color-box early"></div>
            <span>早班 (07:00~19:00)</span>
        </div>
        <div class="legend-item">
            <div class="color-box night"></div>
            <span>大夜班 (19:00~07:00)</span>
        </div>
        <div class="legend-item">
            <div class="color-box rest"></div>
            <span>休假 (淺綠)</span>
        </div>
        <div class="legend-item">
            <div class="color-box today"></div>
            <span>今天</span>
        </div>
    </div>
</div>

<script>
    // 狀態變數：當前顯示的年、月
    let currentYear, currentMonth;

    // 【核心邏輯】做二休二的基準日
    const BASE_DATE = new Date(2026, 9, 1); // 2026年10月1日
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    // 【班別輪替】早班、大夜班基準點
    const SHIFT_ANCHOR_YEAR = 2026;
    const SHIFT_ANCHOR_MONTH = 11; // 11代表12月
    const SHIFT_CYCLE_MONTHS = 5;  // 每5個月輪替一次

    function init() {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        renderCalendar(currentYear, currentMonth);
        bindEvents();
    }

    function getShiftStatus(date) {
        const diffTime = date.getTime() - BASE_DATE.getTime();
        const diffDays = Math.round(diffTime / MS_PER_DAY);
        let mod = ((diffDays % 4) + 4) % 4;
        return (mod === 0 || mod === 1) ? 'rest' : 'work';
    }

    function getShiftType(year, month) {
        const monthIndex = year * 12 + month;
        const anchorIndex = SHIFT_ANCHOR_YEAR * 12 + SHIFT_ANCHOR_MONTH;
        const diff = monthIndex - anchorIndex;
        let cycle = ((diff % (SHIFT_CYCLE_MONTHS * 2)) + (SHIFT_CYCLE_MONTHS * 2)) % (SHIFT_CYCLE_MONTHS * 2);
        return cycle < SHIFT_CYCLE_MONTHS ? 'early' : 'night';
    }

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ''; 

        document.getElementById('monthYearTitle').textContent = `${year} 年 ${month + 1} 月`;

        const shiftType = getShiftType(year, month);
        const shiftName = shiftType === 'early' ? '早班' : '大夜班';
        const shiftTime = shiftType === 'early' ? '07:00 ~ 19:00' : '19:00 ~ 07:00';
        
        document.getElementById('currentShiftInfo').textContent = `本月班別：${shiftName} (${shiftTime})`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach((day, index) => {
            const headerCell = document.createElement('div');
            headerCell.className = `weekday-header ${index === 0 || index === 6 ? 'weekend' : ''}`;
            headerCell.textContent = day;
            grid.appendChild(headerCell);
        });

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dayCell = document.createElement('div');
            
            const status = getShiftStatus(date);
            
            let cellClass = 'day-cell ';
            if (status === 'rest') {
                cellClass += 'rest';
            } else {
                cellClass += shiftType;
            }
            dayCell.className = cellClass;
            
            if (isCurrentMonth && today.getDate() === day) {
                dayCell.classList.add('today');
            }

            const dateNumber = document.createElement('div');
            dateNumber.className = 'day-number';
            dateNumber.textContent = day;
            dayCell.appendChild(dateNumber);

            const badge = document.createElement('div');
            badge.className = 'shift-badge';
            badge.textContent = status === 'work' ? '班' : '休';
            dayCell.appendChild(badge);

            const typeBadge = document.createElement('div');
            typeBadge.className = 'shift-type-badge';
            typeBadge.textContent = status === 'work' ? (shiftType === 'early' ? '早' : '夜') : (shiftType === 'early' ? '早休' : '夜休');
            dayCell.appendChild(typeBadge);

            grid.appendChild(dayCell);
        }
    }

    function bindEvents() {
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar(currentYear, currentMonth);
        });
    }

    init();
</script>

</body>
</html>
