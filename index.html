<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萬年曆 - 做二休二班表 (2026)</title>
    <!-- 引入 html2canvas 用於生成桌布 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            
            /* 早班配色：淺黃底 + 黑字 */
            --early-bg: #fff9c4;
            --early-text: #000000;
            --early-border: #fdd835;
            
            /* 夜班配色：深紫黑底 + 黃字 */
            --night-bg: #2a1e3f;
            --night-text: #ffeb3b;
            --night-border: #4a3b63;
            
            /* 休假配色：淺綠底 + 深綠字 */
            --rest-bg: #e8f5e9;
            --rest-text: #1b5e20;
            --rest-border: #a5d6a7;
            
            --today-border: #ff9800;
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calendar-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .shift-info {
            font-size: 0.85rem;
            color: #555;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .nav-buttons button:hover {
            background-color: #1a252f;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            padding: 10px 0;
            font-size: 1rem;
        }

        .weekday-header.weekend {
            color: #e53935;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 500;
            position: relative;
            cursor: default; /* 預設為一般游標 */
            transition: transform 0.1s, box-shadow 0.2s;
            border: 2px solid transparent;
            padding: 4px;
            box-sizing: border-box;
            min-width: 0;
        }

        /* 休假或是手動調整過的日期，才顯示可點擊的手指游標 */
        .day-cell.rest, .day-cell.manual-adjusted {
            cursor: pointer;
        }

        .day-cell.rest:hover, .day-cell.manual-adjusted:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .day-cell.empty {
            background-color: #fafafa;
            border: none;
            pointer-events: none;
        }

        /* 手動調整過的日期，加上橘色虛線外框 */
        .day-cell.manual-adjusted {
            border: 3px dashed #ff5722;
            box-shadow: 0 0 6px rgba(255, 87, 34, 0.4);
        }

        .day-cell.early {
            background-color: var(--early-bg);
            color: var(--early-text);
            border-color: var(--early-border); 
        }

        .day-cell.night {
            background-color: var(--night-bg);
            color: var(--night-text);
            border-color: var(--night-border); 
        }

        .day-cell.rest {
            background-color: var(--rest-bg);
            color: var(--rest-text);
            border-color: var(--rest-border); 
        }

        .day-number {
            font-size: 1.3rem;
            line-height: 1;
        }

        .shift-badge {
            font-size: 0.75rem;
            margin-top: 6px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        .early .shift-badge { background-color: var(--early-text); color: var(--early-bg); }
        .night .shift-badge { background-color: var(--night-text); color: var(--night-bg); }
        .rest .shift-badge { background-color: var(--rest-text); color: var(--rest-bg); }

        .day-cell.today {
            border: 3px solid var(--today-border) !important;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            z-index: 1;
        }

        /* 下載按鈕區塊 */
        .download-section {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .btn-download-wallpaper {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download-wallpaper:hover {
            background-color: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-download-wallpaper:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            font-size: 0.9rem;
            color: #555;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border-width: 2px;
            border-style: solid;
        }

        .color-box.early { background-color: var(--early-bg); border-color: var(--early-border); }
        .color-box.night { background-color: var(--night-bg); border-color: var(--night-border); }
        .color-box.rest { background-color: var(--rest-bg); border-color: var(--rest-border); }
        .color-box.today { background-color: #fff; border: 3px solid var(--today-border); }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .calendar-container { padding: 12px; }
            
            .header { 
                flex-direction: column; 
                align-items: stretch; 
                gap: 8px; 
                margin-bottom: 15px;
                padding-bottom: 10px;
            }
            .header h2 { font-size: 1.3rem; text-align: center; }
            .shift-info { text-align: center; font-size: 0.8rem; }
            .nav-buttons { justify-content: center; }
            .nav-buttons button { padding: 6px 12px; font-size: 0.85rem; }
            
            .calendar-grid { gap: 3px; }
            .weekday-header { font-size: 0.8rem; padding: 5px 0; }
            
            .day-cell {
                aspect-ratio: auto;
                min-height: 55px;
                padding: 2px 0;
                border-width: 1px;
            }
            .day-cell.manual-adjusted { border-width: 2px; }
            
            .day-number { font-size: 0.95rem; }
            .shift-badge { font-size: 0.6rem; padding: 2px 5px; margin-top: 3px; border-radius: 4px; }
            
            .day-cell.today { border-width: 2px !important; }
            
            .btn-download-wallpaper {
                width: 100%;
                padding: 14px 0;
                justify-content: center;
                font-size: 1rem;
            }
            
            .legend { flex-direction: column; align-items: center; gap: 8px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header">
        <h2 id="monthYearTitle">載入中...</h2>
        <div class="shift-info" id="currentShiftInfo">班別載入中...</div>
        <div class="nav-buttons">
            <button id="prevBtn">&lt; 上個月</button>
            <button id="todayBtn">回今天</button>
            <button id="nextBtn">下個月 &gt;</button>
        </div>
    </div>

    <!-- 班表日曆 -->
    <div class="calendar-grid" id="calendarGrid">
        <!-- 日曆內容將由 JavaScript 動態生成 -->
    </div>

    <!-- 下載按鈕區塊 -->
    <div class="download-section">
        <button id="downloadWallpaperBtn" class="btn-download-wallpaper">📱 下載手機桌布</button>
    </div>

    <!-- 圖例說明 -->
    <div class="legend">
        <div class="legend-item">
            <div class="color-box early"></div>
            <span>早班 (07:00~19:00)</span>
        </div>
        <div class="legend-item">
            <div class="color-box night"></div>
            <span>大夜班 (19:00~07:00)</span>
        </div>
        <div class="legend-item">
            <div class="color-box rest"></div>
            <span>休假 (淺綠)</span>
        </div>
        <div class="legend-item">
            <div class="color-box today"></div>
            <span>今天</span>
        </div>
        <div class="legend-item" style="color:#ff5722;">
            <span style="font-size:1.2rem; line-height:1;">◌</span>
            <span>手動調整 (休假改上班)</span>
        </div>
    </div>
</div>

<script>
    // 狀態變數：當前顯示的年、月
    let currentYear, currentMonth;

    // 【核心邏輯】做二休二的基準日
    const BASE_DATE = new Date(2026, 9, 1); // 2026年10月1日
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    // 【班別輪替】早班、大夜班基準點
    const SHIFT_ANCHOR_YEAR = 2026;
    const SHIFT_ANCHOR_MONTH = 11; // 11代表12月
    const SHIFT_CYCLE_MONTHS = 5;  // 每5個月輪替一次

    // 【手動調整】儲存使用者手動修改的日期與班別
    let manualOverrides = {};
    const STORAGE_KEY_OVERRIDES = 'tsmc_manual_overrides';

    function init() {
        // 載入手動調整記錄
        const saved = localStorage.getItem(STORAGE_KEY_OVERRIDES);
        if (saved) {
            try {
                manualOverrides = JSON.parse(saved);
            } catch (e) {
                manualOverrides = {};
            }
        }

        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        renderCalendar(currentYear, currentMonth);
        bindEvents();
    }

    // 取得日期字串 (YYYY-MM-DD)
    function getDateStr(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // 取得原始做二休二的狀態
    function getOriginalShiftStatus(date) {
        const diffTime = date.getTime() - BASE_DATE.getTime();
        const diffDays = Math.round(diffTime / MS_PER_DAY);
        let mod = ((diffDays % 4) + 4) % 4;
        return (mod === 0 || mod === 1) ? 'rest' : 'work';
    }

    // 取得最終狀態（包含手動覆蓋）
    function getShiftStatus(date) {
        const dateStr = getDateStr(date);
        if (manualOverrides[dateStr]) {
            return manualOverrides[dateStr];
        }
        return getOriginalShiftStatus(date);
    }

    function getShiftType(year, month) {
        const monthIndex = year * 12 + month;
        const anchorIndex = SHIFT_ANCHOR_YEAR * 12 + SHIFT_ANCHOR_MONTH;
        const diff = monthIndex - anchorIndex;
        let cycle = ((diff % (SHIFT_CYCLE_MONTHS * 2)) + (SHIFT_CYCLE_MONTHS * 2)) % (SHIFT_CYCLE_MONTHS * 2);
        return cycle < SHIFT_CYCLE_MONTHS ? 'early' : 'night';
    }

    // 點擊日期處理邏輯
    function handleCellClick(date) {
        const dateStr = getDateStr(date);
        const currentStatus = getShiftStatus(date);
        const originalStatus = getOriginalShiftStatus(date);
        const isManuallyAdjusted = manualOverrides[dateStr] !== undefined;

        // 如果原本就是上班，且不是手動改的，點擊不做任何事
        if (currentStatus === 'work' && !isManuallyAdjusted) {
            return; 
        }

        // 如果現在是休假，詢問是否變更為上班
        if (currentStatus === 'rest') {
            if (confirm('是否將此日變更為上班？')) {
                manualOverrides[dateStr] = 'work';
                localStorage.setItem(STORAGE_KEY_OVERRIDES, JSON.stringify(manualOverrides));
                renderCalendar(currentYear, currentMonth);
            }
        } 
        // 如果現在是上班，且是手動改的，詢問是否變更回休假
        else if (currentStatus === 'work' && isManuallyAdjusted) {
            if (confirm('是否將此日變更回休假？')) {
                delete manualOverrides[dateStr];
                localStorage.setItem(STORAGE_KEY_OVERRIDES, JSON.stringify(manualOverrides));
                renderCalendar(currentYear, currentMonth);
            }
        }
    }

    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ''; 

        document.getElementById('monthYearTitle').textContent = `${year} 年 ${month + 1} 月`;

        const shiftType = getShiftType(year, month);
        const shiftName = shiftType === 'early' ? '早班' : '大夜班';
        const shiftTime = shiftType === 'early' ? '07:00 ~ 19:00' : '19:00 ~ 07:00';
        
        document.getElementById('currentShiftInfo').textContent = `本月班別：${shiftName} (${shiftTime})`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach((day, index) => {
            const headerCell = document.createElement('div');
            headerCell.className = `weekday-header ${index === 0 || index === 6 ? 'weekend' : ''}`;
            headerCell.textContent = day;
            grid.appendChild(headerCell);
        });

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dayCell = document.createElement('div');
            
            const status = getShiftStatus(date);
            const isManualAdjusted = manualOverrides[getDateStr(date)] !== undefined;
            
            let cellClass = 'day-cell ';
            if (status === 'rest') {
                cellClass += 'rest';
            } else {
                cellClass += shiftType;
            }
            
            if (isManualAdjusted) {
                cellClass += ' manual-adjusted';
            }
            
            dayCell.className = cellClass;
            
            if (isCurrentMonth && today.getDate() === day) {
                dayCell.classList.add('today');
            }

            const dateNumber = document.createElement('div');
            dateNumber.className = 'day-number';
            dateNumber.textContent = day;
            dayCell.appendChild(dateNumber);

            const badge = document.createElement('div');
            badge.className = 'shift-badge';
            if (status === 'work') {
                badge.textContent = shiftType === 'early' ? '早班' : '夜班';
            } else {
                badge.textContent = '休';
            }
            dayCell.appendChild(badge);

            // 加入點擊事件
            dayCell.addEventListener('click', () => {
                handleCellClick(date);
            });

            grid.appendChild(dayCell);
        }
    }

    function bindEvents() {
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('downloadWallpaperBtn').addEventListener('click', generateMobileWallpaper);
    }

    // ================= 下載手機桌布功能 =================
    async function generateMobileWallpaper() {
        const btn = document.getElementById('downloadWallpaperBtn');
        const originalText = btn.textContent;
        btn.textContent = '⏳ 生成中...';
        btn.disabled = true;

        const year = currentYear;
        const month = currentMonth;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const shiftType = getShiftType(year, month);
        const shiftName = shiftType === 'early' ? '早班' : '大夜班';
        const shiftTime = shiftType === 'early' ? '07:00 ~ 19:00' : '19:00 ~ 07:00';

        const cardDiv = document.createElement('div');
        cardDiv.style.width = '360px';
        cardDiv.style.backgroundColor = '#fdf8e7';
        cardDiv.style.fontFamily = "'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif";
        cardDiv.style.padding = '24px 20px';
        cardDiv.style.borderRadius = '28px';
        cardDiv.style.boxSizing = 'border-box';
        cardDiv.style.position = 'fixed';
        cardDiv.style.left = '-9999px';
        cardDiv.style.top = '0';

        const titleDiv = document.createElement('div');
        titleDiv.style.textAlign = 'center';
        titleDiv.style.marginBottom = '20px';
        titleDiv.innerHTML = `
            <div style="font-size: 26px; font-weight: 800; color: #2c3e50;">${year}年 ${month + 1}月 班表</div>
            <div style="font-size: 14px; font-weight: 600; color: #555; background: #e9ecef; display: inline-block; padding: 4px 12px; border-radius: 12px; margin-top: 8px;">
                本月班別：${shiftName} (${shiftTime})
            </div>
        `;
        cardDiv.appendChild(titleDiv);

        const weekRow = document.createElement('div');
        weekRow.style.display = 'grid';
        weekRow.style.gridTemplateColumns = 'repeat(7, 1fr)';
        weekRow.style.gap = '4px';
        weekRow.style.textAlign = 'center';
        weekRow.style.marginBottom = '8px';
        ['日', '一', '二', '三', '四', '五', '六'].forEach(day => {
            const span = document.createElement('div');
            span.textContent = day;
            span.style.fontWeight = 'bold';
            span.style.fontSize = '12px';
            span.style.color = '#4361ee';
            span.style.padding = '6px 0';
            span.style.backgroundColor = '#f0f3ff';
            span.style.borderRadius = '8px';
            weekRow.appendChild(span);
        });
        cardDiv.appendChild(weekRow);

        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(7, 1fr)';
        grid.style.gap = '5px';

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.style.height = '50px';
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const status = getShiftStatus(date);
            const isManualAdjusted = manualOverrides[getDateStr(date)] !== undefined;
            
            const cell = document.createElement('div');
            cell.style.height = '50px';
            cell.style.borderRadius = '8px';
            cell.style.display = 'flex';
            cell.style.flexDirection = 'column';
            cell.style.justifyContent = 'center';
            cell.style.alignItems = 'center';
            cell.style.fontSize = '13px';
            cell.style.fontWeight = 'bold';
            cell.style.border = '1px solid transparent';

            // 如果手動調整，桌布上加個虛線框
            if (isManualAdjusted) {
                cell.style.border = '2px dashed #ff5722';
            }

            let cellBg, cellColor, cellText;

            if (status === 'rest') {
                cellBg = '#e8f5e9';
                cellColor = '#1b5e20';
                cellText = '休';
                if (!isManualAdjusted) cell.style.borderColor = '#a5d6a7';
            } else {
                if (shiftType === 'early') {
                    cellBg = '#fff9c4';
                    cellColor = '#000000';
                    cellText = '早班';
                    if (!isManualAdjusted) cell.style.borderColor = '#fdd835';
                } else {
                    cellBg = '#2a1e3f';
                    cellColor = '#ffeb3b';
                    cellText = '夜班';
                    if (!isManualAdjusted) cell.style.borderColor = '#4a3b63';
                }
            }

            cell.style.backgroundColor = cellBg;
            cell.style.color = cellColor;
            cell.innerHTML = `<div>${day}</div><div style="font-size:9px; margin-top:2px;">${cellText}</div>`;
            grid.appendChild(cell);
        }
        cardDiv.appendChild(grid);

        const legendDiv = document.createElement('div');
        legendDiv.style.marginTop = '20px';
        legendDiv.style.display = 'flex';
        legendDiv.style.justifyContent = 'space-around';
        legendDiv.style.fontSize = '11px';
        legendDiv.style.color = '#555';
        legendDiv.style.backgroundColor = '#f1f5fe';
        legendDiv.style.padding = '8px 12px';
        legendDiv.style.borderRadius = '12px';
        legendDiv.innerHTML = `
            <div style="display:flex; align-items:center; gap:4px;"><span style="display:inline-block; width:12px; height:12px; background:#fff9c4; border:1px solid #fdd835; border-radius:3px;"></span>早班</div>
            <div style="display:flex; align-items:center; gap:4px;"><span style="display:inline-block; width:12px; height:12px; background:#2a1e3f; border:1px solid #4a3b63; border-radius:3px;"></span>夜班</div>
            <div style="display:flex; align-items:center; gap:4px;"><span style="display:inline-block; width:12px; height:12px; background:#e8f5e9; border:1px solid #a5d6a7; border-radius:3px;"></span>休假</div>
        `;
        cardDiv.appendChild(legendDiv);

        document.body.appendChild(cardDiv);

        try {
            const canvas = await html2canvas(cardDiv, { 
                scale: 2.5, 
                backgroundColor: '#fdf8e7',
                borderRadius: '28px'
            });
            
            document.body.removeChild(cardDiv);

            const wallpaperCanvas = document.createElement('canvas');
            wallpaperCanvas.width = 1080;
            wallpaperCanvas.height = 1920;
            const ctx = wallpaperCanvas.getContext('2d');
            
            ctx.fillStyle = '#fdf8e7';
            ctx.fillRect(0, 0, 1080, 1920);

            const targetWidth = 1080 * 0.80;
            const scale = targetWidth / canvas.width;
            const targetHeight = canvas.height * scale;
            const x = (1080 - targetWidth) / 2;
            const y = (1920 - targetHeight) / 2;

            ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, x, y, targetWidth, targetHeight);

            wallpaperCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.download = `${year}年${month + 1}月_班表桌布.png`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                
                btn.textContent = originalText;
                btn.disabled = false;
            }, 'image/png');

        } catch (error) {
            console.error('生成桌布失敗:', error);
            if (document.body.contains(cardDiv)) {
                document.body.removeChild(cardDiv);
            }
            alert('生成桌布失敗，請重試。');
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }

    init();
</script>

</body>
</html>
